[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates that are not published (the model check, `fakecore`, `rewrite`, `xtask`) depend on the others
# by path only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Protocol and format names in the examples, and systems that the derive reads arguments on, which
# are not code; ".." keeps clippy's defaults.
doc-valid-idents = [
  "EtherType", "IPsec", "ICMPv6", "PPPoE", "NetFlow", "NTPv4", "ClientHello", "QoS", "OSPFv2",
  "IGMPv2", "IGMPv3", "SocketCAN", "MessagePack", "ZigZag", "GeneralizedTime", "SNMPv1", "DragonFly",
  "..",
]

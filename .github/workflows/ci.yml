name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On demand, on any branch: to read the times of the jobs again without a commit (the first
  # run after a change of a cache key has nothing cached).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `cargo test --workspace --exclude puns-model`, in six jobs: what it builds (every test file
  # is a binary, eleven of which hold an example) is most of its minute. With the jobs of the
  # model check below, this is `cargo test --all`. Without the `unstable` feature, the default:
  # every test that builds without it. With it, apart: what is about it (`.github/tests.sh`).
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The unit tests, the doc tests (README included).
          - name: library, docs
            id: library
            run: |
              cargo test -p puns --lib
              cargo test --workspace --exclude puns-model --doc
          # Apart: trybuild builds each program, about twenty seconds. The cases of
          # `compile-fail-kept`: the refusals and their messages.
          - name: compile-fail
            id: compile-fail
            run: cargo test -p puns --test compile_fail
          # The other test files, every other one each. Each example is run through its test
          # (`tests/ethernet.rs`...), which asserts its results.
          - name: integration, 1 of 2
            id: integration-1
            part: 1
            run: cargo test -p puns $TESTS
          - name: integration, 2 of 2
            id: integration-2
            part: 2
            run: cargo test -p puns $TESTS
          # With the feature: the targets that require it, the tests under it, the cases of
          # `compile-fail-unstable`. `codegen` has no test, and is built.
          - name: unstable
            id: unstable
            part: unstable
            run: |
              cargo test -p puns --features unstable --lib $TESTS
              cargo test -p puns --features unstable --doc
              cargo build -p puns --features unstable --example codegen
          - name: unstable, compile-fail
            id: unstable-compile-fail
            run: cargo test -p puns --features unstable --test compile_fail
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          # A cache for each job of the matrix: they do not build the same binaries. Not the
          # name: a key of a cache has no comma.
          key: test-${{ matrix.id }}
      - name: Select the test files of the job
        if: matrix.part
        run: |
          case "${{ matrix.part }}" in
            unstable) tests=$(sh .github/tests.sh unstable) ;;
            *)
              tests=$(sh .github/tests.sh default)
              tests=$(echo "$tests" | awk -v part="${{ matrix.part }}" 'NR % 2 == part % 2')
              ;;
          esac
          echo "TESTS=$(echo $tests)" >> "$GITHUB_ENV"
      - run: ${{ matrix.run }}

  # The sample of the model check that every push runs (the exhaustive one is `model.yml`): about
  # as long to build as everything else, so jobs of its own. `miri_sample` and `parts` are each
  # about twenty seconds of build, a job each; the shapes are a job each way too; the other files
  # together are less. Together they
  # are `cargo test -p puns-model`, without the `unstable` feature, then with it (`puns` takes
  # the layout that `rustc` chose: other verdicts, of other code).
  model:
    name: Model check (sample, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: puns
            id: model-puns
            tests: --test miri_sample
          - name: rules, unsized, views
            id: model-rules
            tests: >-
              --lib --test core_shadowed --test regressions --test rules --test dst --test views
              --test aims
          - name: shapes
            id: model-shapes
            tests: --test shapes
          - name: parts
            id: model-parts
            tests: --test parts
          - name: unstable, puns
            id: model-unstable-puns
            tests: --features unstable --test miri_sample
          - name: unstable, rules, unsized, views
            id: model-unstable-rules
            tests: >-
              --features unstable --lib --test core_shadowed --test regressions --test rules
              --test dst --test views --test aims
          - name: unstable, shapes
            id: model-unstable-shapes
            tests: --features unstable --test shapes
          - name: unstable, parts
            id: model-unstable-parts
            tests: --features unstable --test parts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the name: a key of a cache has no comma.
          key: ${{ matrix.id }}
      - run: cargo test -p puns-model ${{ matrix.tests }}

  # Without the `unstable` feature, nothing that `puns` does depends on what Rust lets `rustc`
  # lay out otherwise ("The `unstable` feature" in the crate docs, `puns/src/lib.rs`).
  # `tests/seeds.rs` records the verdict of every function on pairs of types, and which bytes each
  # accepts: the record must be `tests/seeds.txt` without `-Zrandomize-layout`, and with it, of
  # each seed (one job each: a seed is other flags, which build everything again).
  stable:
    name: Kept layouts (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      # Every `cargo` of the job is the one of the matrix (see the Miri jobs).
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: record
            id: stable
            toolchain: 1.100.0
            run: cargo test -p puns --features verdict --test seeds
          - name: seed 1
            id: seed-1
            toolchain: nightly-2026-11-17
            flags: -Zrandomize-layout -Zlayout-seed=1
            run: cargo test -p puns --features verdict --test seeds
          - name: seed 2
            id: seed-2
            toolchain: nightly-2026-11-17
            flags: -Zrandomize-layout -Zlayout-seed=2
            run: cargo test -p puns --features verdict --test seeds
          - name: seed 3
            id: seed-3
            toolchain: nightly-2026-11-17
            flags: -Zrandomize-layout -Zlayout-seed=3
            run: cargo test -p puns --features verdict --test seeds
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the name: a key of a cache has no comma.
          key: ${{ matrix.id }}
      - run: ${{ matrix.run }}
        env:
          RUSTFLAGS: ${{ matrix.flags }}

  clippy:
    name: Clippy, documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests --examples --benches -- -D warnings
      # With the `unstable` feature: the targets that require it, the code under it.
      - run: >-
          cargo clippy --workspace --tests --examples --benches
          --features puns/unstable,puns-model/unstable -- -D warnings
      # The documentation, in the same job: the same toolchain, a few seconds more.
      - run: cargo doc --no-deps --all
        env:
          RUSTDOCFLAGS: -D warnings
      # The links of the README and of `docs/` name the version of `puns`, and their targets are
      # there, the sections of the documentation just built included.
      - run: cargo xtask links --check

  # The `rust-version` of the crates (1.99, the first stable release with `size_of_val_raw` and
  # `align_of_val_raw` in `const`): the library and its examples, which a build evaluates, refusals
  # included. `RUSTUP_TOOLCHAIN` takes precedence over `rust-toolchain`.
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo build -p puns --examples

  no_std:
    name: No std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A target without `std`: nothing may need it.
      - run: cargo build -p puns --target thumbv7em-none-eabihf
      # A 16-bit target (a `usize` of 16 bits, `isize::MAX` of 32 KiB, see "Portability" in the
      # crate docs, `puns/src/lib.rs`), whose `core` is built from source on the pinned nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rust-src
      - run: cargo +nightly-2026-11-17 build -p puns -Zbuild-std=core --target msp430-none-elf

  fmt:
    name: Format, examples of the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustfmt.toml` uses unstable options.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rustfmt
      - run: cargo +nightly-2026-11-17 fmt --all -- --check
      # What docs.rs measures: every public item of `puns` documented (`#![deny(missing_docs)]`),
      # and every item that rustdoc counts with an example, which only a nightly rustdoc tells
      # (the lint lists the items that have none). Here, where the nightly already is: it builds
      # the derive and its dependencies, a few seconds without a cache.
      - run: >-
          cargo +nightly-2026-11-17 rustdoc -p puns -- -Z unstable-options
          '-Zcrate-attr=feature(rustdoc_missing_doc_code_examples)'
          -D rustdoc::missing_doc_code_examples

  # One job for each run, side by side: each is a check of its own, of less than a minute.
  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      # Every `cargo` of the job is the nightly one: without this, the first one that is not
      # asked for it (the one of the cache action) installs the toolchain of `rust-toolchain`,
      # ten seconds for a compiler that the job does not use.
      RUSTUP_TOOLCHAIN: nightly-2026-11-17
      # Where Miri keeps the standard library that it builds for its target: twenty seconds of
      # build, so a directory that is cached (below).
      MIRI_SYSROOT: /home/runner/miri-sysroot
      # The sources that it builds it from, which the toolchain installs.
      MIRI_SOURCES: >-
        /home/runner/.rustup/toolchains/nightly-2026-11-17-x86_64-unknown-linux-gnu/lib/rustlib/src
    strategy:
      fail-fast: false
      matrix:
        include:
          # Of the tests of `puns`, the ones that Miri runs, for each run: three parts of about the
          # same time under Miri without the `unstable` feature, and the files about it, with it, in
          # two parts (see the step that selects them).
          - name: tree borrows, 1 of 3
            id: tree
            args: -p puns
            part: 1
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: tree borrows, 2 of 3
            id: tree
            args: -p puns
            part: 2
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: tree borrows, 3 of 3
            id: tree
            args: -p puns
            part: 3
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: tree borrows, unstable, 1 of 2
            id: tree-unstable-1
            args: -p puns
            part: unstable-1
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: tree borrows, unstable, 2 of 2
            id: tree-unstable-2
            args: -p puns
            part: unstable-2
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          # Stacked borrows, on a big-endian target: what loads integers, sums and CRCs several
          # bytes at a time must not depend on the byte order of the target, and the rules of
          # stacked borrows do not depend on the target (x86-64 has the jobs above).
          - name: stacked borrows, big-endian, 1 of 3
            id: stacked-s390x
            args: -p puns
            target: s390x-unknown-linux-gnu
            part: 1
            flags: -Zmiri-strict-provenance
          - name: stacked borrows, big-endian, 2 of 3
            id: stacked-s390x
            args: -p puns
            target: s390x-unknown-linux-gnu
            part: 2
            flags: -Zmiri-strict-provenance
          - name: stacked borrows, big-endian, 3 of 3
            id: stacked-s390x
            args: -p puns
            target: s390x-unknown-linux-gnu
            part: 3
            flags: -Zmiri-strict-provenance
          - name: stacked borrows, big-endian, unstable, 1 of 2
            id: stacked-s390x-unstable-1
            args: -p puns
            target: s390x-unknown-linux-gnu
            part: unstable-1
            flags: -Zmiri-strict-provenance
          - name: stacked borrows, big-endian, unstable, 2 of 2
            id: stacked-s390x-unstable-2
            args: -p puns
            target: s390x-unknown-linux-gnu
            part: unstable-2
            flags: -Zmiri-strict-provenance
          # 32 bits: a smaller `usize`, a `u64` aligned to 4.
          - name: 32 bits, 1 of 3
            id: i686
            args: -p puns
            target: i686-unknown-linux-gnu
            part: 1
            flags: -Zmiri-strict-provenance
          - name: 32 bits, 2 of 3
            id: i686
            args: -p puns
            target: i686-unknown-linux-gnu
            part: 2
            flags: -Zmiri-strict-provenance
          - name: 32 bits, 3 of 3
            id: i686
            args: -p puns
            target: i686-unknown-linux-gnu
            part: 3
            flags: -Zmiri-strict-provenance
          - name: 32 bits, unstable, 1 of 2
            id: i686-unstable-1
            args: -p puns
            target: i686-unknown-linux-gnu
            part: unstable-1
            flags: -Zmiri-strict-provenance
          - name: 32 bits, unstable, 2 of 2
            id: i686-unstable-2
            args: -p puns
            target: i686-unknown-linux-gnu
            part: unstable-2
            flags: -Zmiri-strict-provenance
          # The model check under Miri: a selection of pairs that runs every unsafe path it
          # reaches (see `puns-model/tests/miri_sample.rs`); the verdicts of every pair are the
          # job of the full native run, in `model.yml`.
          # In seven jobs: each of the two tests of the selection (told apart by name), the unit
          # tests with the regressions and the view enums, the parts with the unsized types, and the
          # shapes, for what a check of them reads, in three parts of about the same time.
          - name: model, puns
            id: model
            args: -p puns-model --test miri_sample
            filter: -- --skip sample_layouts
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, library, regressions, views
            id: model
            args: -p puns-model --lib --test core_shadowed --test regressions --test views
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, layouts
            id: model
            args: -p puns-model --test miri_sample
            filter: -- sample_layouts
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, parts
            id: model
            args: -p puns-model --test parts --test dst
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, shapes, array under an enum
            id: model
            args: -p puns-model --test shapes
            filter: -- --exact array_under_an_enum
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, shapes, union next to a check
            id: model
            args: -p puns-model --test shapes
            filter: -- --exact union_next_to_a_check
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
          - name: model, shapes
            id: model
            args: -p puns-model --test shapes
            filter: -- --skip array_under_an_enum --skip union_next_to_a_check
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the name: a key of a cache has no comma.
          key: ${{ matrix.id }}
      # The standard library of Miri, for the toolchain and the target: built by the step after
      # this one when the cache does not have it. With the sources it was built from: Miri
      # builds it again when the modification time of one of them is not what it was, and each
      # run installs them anew. The cache brings them back as they were.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.MIRI_SYSROOT }}
            ${{ env.MIRI_SOURCES }}
          key: miri-std-nightly-2026-11-17-${{ matrix.target || 'host' }}
      - run: cargo miri setup ${{ matrix.target && format('--target {0}', matrix.target) }}
      # A test file that is not for Miri says so (`#![cfg(not(miri))]`: the examples other than
      # `ethernet`, the trybuild test, what is about the derive and not the unsafe code). With
      # `--tests`, each would still be a binary that Miri starts to run nothing, a second each.
      # The first two parts are named, about seventeen seconds of Miri each on x86-64 with tree
      # borrows (less on the other targets); the third is every other file that Miri runs without
      # the feature, so that a new file runs. A named file that is not there fails the job. The
      # files about the feature run with it, every other one each. Under Miri, the unit tests run
      # without the feature only: with it, fourteen seconds more.
      - name: Select the tests that Miri runs
        if: matrix.part
        env:
          # The targets other than the host run with stacked borrows.
          STACKED: ${{ matrix.target && '1' || '0' }}
        run: |
          one="--lib --test core_shadowed --test str"
          two="--test ethernet --test checksums --test bytes --test patterns"
          case "${{ matrix.part }}" in
            1) tests=$one ;;
            2) tests=$two ;;
            3)
              tests=""
              for test in $(MIRI=1 STACKED=$STACKED sh .github/tests.sh default | sed 's/^--test //'); do
                case " $one $two " in
                  *" --test $test "*) ;;
                  *) tests="$tests --test $test" ;;
                esac
              done
              ;;
            unstable-*)
              tests=$(MIRI=1 STACKED=$STACKED sh .github/tests.sh unstable)
              half="${{ matrix.part }}"
              tests=$(echo "$tests" | awk -v half="${half#unstable-}" 'NR % 2 == half % 2')
              tests="--features unstable $tests"
              ;;
          esac
          echo "TESTS=$(echo $tests)" >> "$GITHUB_ENV"
      - run: >-
          cargo miri test ${{ matrix.args }}
          ${{ matrix.target && format('--target {0}', matrix.target) }} $TESTS ${{ matrix.filter }}
        env:
          MIRIFLAGS: ${{ matrix.flags }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm rust-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2

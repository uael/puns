name: Model check

# The exhaustive model check: every pair of the types of the model, every part, every value over
# the alphabets, every pair of the types of 1 and 2 bytes as a view enum
# (`puns-model/tests/size*.rs`, `parts*.rs` and `views_full.rs`, behind the `full` feature, which
# `cargo test` does not build). It takes minutes to build and a few to run, too long for every
# push, where CI runs a sample of it: here on demand, and every night.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  model:
    name: Model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Optimized: the `model` profile is the release one without LTO. Without the `unstable`
      # feature, then with it: `puns` takes the layout that `rustc` chose, other verdicts.
      - run: cargo test --profile model -p puns-model --features full
      - run: cargo test --profile model -p puns-model --features full,unstable
      # The tests that CI does not build on a push.
      - run: cargo clippy -p puns-model --tests --features full -- -D warnings
      - run: cargo clippy -p puns-model --tests --features full,unstable -- -D warnings

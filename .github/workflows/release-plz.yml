name: Release-plz

on:
  push:
    branches: [main]

jobs:
  # Publishes only when the pushed commit is a merged release PR (`release_always = false` in
  # `release-plz.toml`): any other push to `main` publishes nothing.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The links of the README and of `docs/` name the version of `puns` (`cargo xtask links`),
      # which the release PR changes: pin them to the new version on the branch of the PR, so that
      # the README published with it leads to that version on docs.rs, crates.io and GitHub. The
      # tag `v{version}` that they name is made when the PR is merged. release-plz force-pushes over
      # a commit of a bot when it updates the PR, and this step then runs again.
      - name: Pin the links to the version of the release
        if: steps.release-plz.outputs.pr && fromJSON(steps.release-plz.outputs.pr).head_branch
        env:
          BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: |
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"
          cargo xtask links
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: pin the links to the version of the release" -- README.md docs
            git push origin "$BRANCH"
          fi

[package]
name = "puns"
version = "0.2.2"
edition.workspace = true
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
description = "Type punning proven at compile time: a safe alternative to transmute and to hand-written parsing of bytes"
repository = "https://github.com/uael/puns"
documentation = "https://docs.rs/puns"
readme = "README.md"
keywords = ["transmute", "zero-copy", "parsing", "bytes", "no-std"]
categories = ["encoding", "parsing", "no-std", "rust-patterns"]

[features]
# The layout that `rustc` chose, as it is, where Rust lets it choose otherwise: the order of the
# fields of a struct or a tuple of the `Rust` representation, the tag of an enum of that
# representation, niches. Without it, nothing that `puns` does depends on that choice
# (`puns::layout::UNSTABLE`). Most tests run without it, the default (`cargo test -p puns --features
# verdict` adds the record of `tests/seeds.rs`); `--features unstable` runs the targets and the
# tests about it.
unstable = []
# Test-only, for `puns-model` and `tests/seeds.rs`: `puns::hook`, what the analysis says of a
# pun without failing to compile. Not part of the API; nothing else changes with it.
verdict = []

[dependencies]
puns-derive = { version = "=0.2.2", path = "../puns-derive" }

[dev-dependencies]
trybuild = "1"

# What is checked at run time, next to the same checks by hand: `cargo bench -p puns --features
# unstable`. Not a test. Two of its cases read slices of enums of the `Rust` representation, which
# needs the `unstable` feature.
[[bench]]
name = "checks"
harness = false
required-features = ["unstable"]

# Enums of the `Rust` representation (found by experiments, `discover.rs`), and `Option` and
# `Result` of anything: the `unstable` feature.
[[test]]
name = "rust_enums"
required-features = ["unstable"]

# What `puns` does without the `unstable` feature, which `-Zrandomize-layout` must not change: the
# verdicts of `puns::hook`.
[[test]]
name = "seeds"
required-features = ["verdict"]

# Its table of machine code (its module documentation) covers enums of the `Rust` representation
# too.
[[example]]
name = "codegen"
required-features = ["unstable"]

[lints]
workspace = true

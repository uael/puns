[package]
name = "puns-model"
version = "0.0.0"
edition.workspace = true
license = "Apache-2.0 OR MIT"
publish = false
description = "Model check of the analysis of puns against an independent oracle"

[dependencies]
puns = { path = "../puns", features = ["verdict"] }

[dev-dependencies]
fakecore = { path = "fakecore" }

[features]
# The model check of `puns` with its `unstable` feature, which takes the layout that `rustc` chose:
# CI runs the sample both ways, `model.yml` the exhaustive check both ways.
unstable = ["puns/unstable"]
# The exhaustive model check (`tests/size*.rs`, `tests/parts2_1.rs`...): thousands of pairs, which
# take minutes to build, so not built by `cargo test`. `model.yml` runs it every night:
# `cargo test --profile model -p puns-model --features full`.
full = []

# A type of the library and a type of an executable of this package, from one file
# (`src/identity.rs`): the executable has the name of the library, as Cargo names the executable of
# a package, and is in `src/` to include the file at the same path.
[[test]]
name = "puns_model"
path = "src/identity_test.rs"

[[test]]
name = "size1_1"
required-features = ["full"]

[[test]]
name = "size1_2"
required-features = ["full"]

[[test]]
name = "size1_3"
required-features = ["full"]

[[test]]
name = "size2_1"
required-features = ["full"]

[[test]]
name = "size2_2"
required-features = ["full"]

[[test]]
name = "size2_3"
required-features = ["full"]

[[test]]
name = "size2_4"
required-features = ["full"]

[[test]]
name = "size2_5"
required-features = ["full"]

[[test]]
name = "size3"
required-features = ["full"]

[[test]]
name = "size4_1"
required-features = ["full"]

[[test]]
name = "size4_2"
required-features = ["full"]

[[test]]
name = "size8"
required-features = ["full"]

[[test]]
name = "views_full_1"
required-features = ["full"]

[[test]]
name = "views_full_2"
required-features = ["full"]

[[test]]
name = "views_full_3"
required-features = ["full"]

[[test]]
name = "parts2_1"
required-features = ["full"]

[[test]]
name = "parts2_2"
required-features = ["full"]

[[test]]
name = "parts3"
required-features = ["full"]

[[test]]
name = "parts4_1"
required-features = ["full"]

[[test]]
name = "parts4_2"
required-features = ["full"]

[[test]]
name = "parts8"
required-features = ["full"]

[[test]]
name = "sources"
required-features = ["full"]

[lints]
workspace = true
